<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotkania — Genzie Hub</title>
<link rel="stylesheet" href="main.css">
</head>
<body oncontextmenu="return false" ondragstart="return false">
  <div id="kod-modal" onclick="zamknijKodModal()">
    <div class="kod-box" onclick="event.stopPropagation()">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> zablokowane</h3>
      <p>Wpisz kod, żeby zobaczyć to zdjęcie.</p>
      <input type="text" id="kod-input" maxlength="4" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter') sprawdzKod()">
      <div class="kod-error" id="kod-error"></div>
      <div class="kod-btns">
        <button class="btn-anuluj" onclick="zamknijKodModal()">anuluj</button>
        <button class="btn-ok" onclick="sprawdzKod()">odblokuj</button>
      </div>
    </div>
  </div>

  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" onclick="event.stopPropagation()" oncontextmenu="return false" draggable="false">
  </div>

  <div class="topbar" id="topbar">
    <div class="logo"><span class="logo-mark">fpf</span><span class="logo-name">genzie hub</span></div>
    <div class="nav-pills" id="navPills">
      <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>start</a>
      <a href="czlonkowie.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 3.1-6 7-6"/><path d="M14 20c0-2.2 1.8-4 4-4"/></svg>członkowie</a>
      <a href="galeria.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L6 19"/></svg>zdjęcia</a>
      <a href="spotkania.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>spotkania</a>
      <a href="informacje.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg>informacje</a>
    </div>
    <span id="auth-pill" class="auth-pill">zaloguj się</span>
  </div>

  <div class="page-wrap">

    <div id="spotkania" class="page page-content active gated-page">
      <h2>spotkania 🗓️💕</h2>
      <p>Zapisz się, czy będziesz na spotkaniu i o której 💖</p>

      <div id="gated-real-content">
        <div class="meetings-list" id="meetingsList"></div>
      </div>
    </div>

  </div>

  <script>
    const topbar = document.getElementById('topbar');
    const SCROLL_THRESHOLD = 40;

    function updateTopbarOnScroll(){
      if (window.scrollY > SCROLL_THRESHOLD) {
        topbar.classList.add('collapsed');
      } else {
        topbar.classList.remove('collapsed');
      }
    }
    window.addEventListener('scroll', updateTopbarOnScroll, { passive: true });
    updateTopbarOnScroll();

    document.querySelectorAll('img').forEach(img => {
      img.setAttribute('draggable', 'false');
      img.addEventListener('contextmenu', e => e.preventDefault());
      img.addEventListener('dragstart', e => e.preventDefault());
    });

    document.addEventListener('contextmenu', function(e){
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
      }
    });

    /* ===== lista spotkań — żeby dodać kolejne, dopisz nowy obiekt tutaj ===== */
    const SPOTKANIA = [
      { id: 'poniedzialek-13', dzien: 'Poniedziałek', domyslna_godzina: '13:00' },
    ];

    function renderMeetings() {
      const list = document.getElementById('meetingsList');
      if (!list) return;
      list.innerHTML = SPOTKANIA.map(m => `
        <div class="rsvp-card" data-meeting="${m.id}">
          <div class="rsvp-head">
            <h3>${m.dzien}</h3>
            <p>proponowana godzina: ${m.domyslna_godzina}</p>
          </div>
          <div class="rsvp-choice">
            <button type="button" class="rsvp-btn tak" data-val="tak" onclick="wybierzOdpowiedz(this, 'tak')">będę ✅</button>
            <button type="button" class="rsvp-btn nie" data-val="nie" onclick="wybierzOdpowiedz(this, 'nie')">nie będę ❌</button>
          </div>
          <div class="rsvp-time-row" style="display:none">
            <label for="czas-${m.id}">o której?</label>
            <input type="time" id="czas-${m.id}" class="rsvp-time" value="${m.domyslna_godzina}">
          </div>
          <button type="button" class="rsvp-save" onclick="zapiszOdpowiedz('${m.id}')">zapisz</button>
          <div class="rsvp-status" id="status-${m.id}"></div>
        </div>
      `).join('');
    }
    renderMeetings();

    function wybierzOdpowiedz(btn, val) {
      const card = btn.closest('.rsvp-card');
      card.querySelectorAll('.rsvp-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      card.dataset.wybor = val;
      card.querySelector('.rsvp-time-row').style.display = (val === 'tak') ? 'flex' : 'none';
    }

    async function zapiszOdpowiedz(meetingId) {
      if (typeof currentUser === 'undefined' || !currentUser) {
        openLoginModal();
        return;
      }
      const card = document.querySelector(`.rsvp-card[data-meeting="${meetingId}"]`);
      const status = document.getElementById(`status-${meetingId}`);
      const wybor = card.dataset.wybor;
      if (!wybor) {
        status.textContent = 'Zaznacz najpierw czy będziesz.';
        status.classList.remove('ok');
        return;
      }
      const godzina = wybor === 'tak' ? document.getElementById(`czas-${meetingId}`).value : null;

      status.textContent = 'zapisywanie...';
      status.classList.remove('ok');

      const { error } = await _sb.from('spotkania_rsvp').upsert({
        user_id: currentUser.id,
        meeting_id: meetingId,
        bedzie: wybor === 'tak',
        godzina: godzina,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,meeting_id' });

      if (error) {
        status.textContent = 'Błąd zapisu, spróbuj ponownie.';
        status.classList.remove('ok');
        return;
      }
      status.textContent = wybor === 'tak'
        ? `zapisano ✅ — będziesz o ${godzina}`
        : 'zapisano — nie będziesz';
      status.classList.add('ok');
    }

    async function wczytajOdpowiedzi() {
      if (typeof currentUser === 'undefined' || !currentUser) return;
      const { data, error } = await _sb
        .from('spotkania_rsvp')
        .select('*')
        .eq('user_id', currentUser.id);
      if (error || !data) return;

      data.forEach(row => {
        const card = document.querySelector(`.rsvp-card[data-meeting="${row.meeting_id}"]`);
        if (!card) return;
        const val = row.bedzie ? 'tak' : 'nie';
        const btn = card.querySelector(`.rsvp-btn[data-val="${val}"]`);
        if (btn) wybierzOdpowiedz(btn, val);
        if (row.bedzie && row.godzina) {
          const timeInput = card.querySelector('.rsvp-time');
          if (timeInput) timeInput.value = row.godzina.slice(0, 5);
        }
        const status = document.getElementById(`status-${row.meeting_id}`);
        if (status) {
          status.textContent = row.bedzie
            ? `zapisano ✅ — będziesz o ${row.godzina ? row.godzina.slice(0,5) : '?'}`
            : 'zapisano — nie będziesz';
          status.classList.add('ok');
        }
      });
    }

    // wywoływane przez auth.js po każdej zmianie stanu logowania
    window.onAuthUpdate = function () {
      wczytajOdpowiedzi();
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
