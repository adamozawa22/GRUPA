  <script>
    const topbar = document.getElementById('topbar');
    const SCROLL_THRESHOLD = 40;

    function updateTopbarOnScroll(){
      if (window.scrollY > SCROLL_THRESHOLD) {
        topbar.classList.add('collapsed');
      } else {
        topbar.classList.remove('collapsed');
      }
    }
    window.addEventListener('scroll', updateTopbarOnScroll, { passive: true });
    updateTopbarOnScroll();

    document.querySelectorAll('img').forEach(img => {
      img.setAttribute('draggable', 'false');
      img.addEventListener('contextmenu', e => e.preventDefault());
      img.addEventListener('dragstart', e => e.preventDefault());
    });

    document.addEventListener('contextmenu', function(e){
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
      }
    });

    /* ---------- hamburger (mobile nav) ---------- */
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navPills = document.getElementById('navPills');
    const navBackdrop = document.getElementById('navBackdrop');

    function openNav() {
      navPills.classList.add('open');
      navBackdrop.classList.add('active');
      hamburgerBtn.classList.add('active');
      hamburgerBtn.setAttribute('aria-expanded', 'true');
      const scrollY = window.scrollY;
      document.body.dataset.scrollY = scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${scrollY}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
    }
    function closeNav() {
      navPills.classList.remove('open');
      navBackdrop.classList.remove('active');
      hamburgerBtn.classList.remove('active');
      hamburgerBtn.setAttribute('aria-expanded', 'false');
      const scrollY = parseInt(document.body.dataset.scrollY || '0', 10);
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      window.scrollTo(0, scrollY);
    }
    function toggleNav() {
      if (navPills.classList.contains('open')) closeNav();
      else openNav();
    }
    navPills.querySelectorAll('.nav-link').forEach(a => a.addEventListener('click', closeNav));
    window.addEventListener('resize', () => { if (window.innerWidth > 720) closeNav(); });

    /* ---------- powitanie: "hej, [nazwa]" ---------- */
    function renderGreeting() {
      const who = document.getElementById('greetingWho');
      if (!who) return;
      if (typeof currentUser !== 'undefined' && currentUser) {
        const name = currentUser.user_metadata?.name || currentUser.email.split('@')[0];
        who.textContent = name;
      } else {
        who.textContent = '👋';
      }
    }
    renderGreeting();
    window.onAuthUpdate = renderGreeting;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
